<header class="w-100 position-sticky top-0 z-3 py-3 px-2 px-md-4">

    <nav class="navbar navbar-expand-lg glass-panel custom-rounded-nav mx-auto shadow-lg px-4 py-2"
        style="max-width: 1300px;">

        <div class="container-fluid">

            <!-- Brand Logo Context Links to Index Route -->
            <a class="navbar-brand text-white fw-bold me-4" href="{{ url_for('index') }}">🎬WhatToWatch</a>

            <!-- Compact Mobile Menu Toggle Button -->
            <div class="mobile-nav-actions d-flex d-lg-none align-items-center gap-2 ms-auto">
                <button id="mobileSearchToggle" class="mobile-nav-icon-btn" type="button"
                    aria-controls="mobileSearchPanel" aria-expanded="false" aria-label="Open search">
                    <i class="bi bi-search" aria-hidden="true"></i>
                </button>
                <button class="navbar-toggler border-0 text-white p-0" type="button" data-bs-toggle="collapse"
                    data-bs-target="#whatToWatchNav" aria-controls="whatToWatchNav" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
                </button>
            </div>

            <!-- Expandable Navbar Elements -->
            <div class="collapse navbar-collapse pb-3 pb-lg-0" id="whatToWatchNav">

                <!-- Left Aligned Links Group -->
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-1 gap-lg-2 mt-2 mt-lg-0">

                    <li class="nav-item">
                        <a class="nav-link text-white fw-medium {% if request.endpoint == 'index' %}nav-link-active{% else %}opacity-75{% endif %}"
                            href="{{ url_for('index') }}">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-white fw-medium {% if request.endpoint == 'about' %}nav-link-active{% else %}opacity-75{% endif %}"
                            href="{{ url_for('about') }}">About</a>
                    </li>

                    <!-- Trending Dropdown Menu Element -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white fw-medium {% if request.endpoint in ['trending_today', 'trending_weekly', 'get_popular_media'] %} nav-link-active{% else %}opacity-75{% endif %}"
                            href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Trending
                        </a>
                        <ul class="dropdown-menu glass-panel shadow border-0 mt-2 p-2 rounded-4">
                            <li>
                                <!-- Links dynamically to today trending route -->
                                <a class="dropdown-item text-white rounded-3 d-flex align-items-center gap-2 py-2"
                                    href="{{ url_for('trending_today') }}">
                                    <!-- Role Icon: Lightning Bolt (Daily/Instant updates) -->
                                    <svg xmlns="http://w3.org" width="14" height="14" fill="currentColor"
                                        class="bi bi-lightning-charge-fill" viewBox="0 0 16 16">
                                        <path
                                            d="M11.251.068a.5.5 0 0 1 .227.58L9.677 6.5H13a.5.5 0 0 1 .364.843l-8 8.5a.5.5 0 0 1-.842-.49L6.323 9.5H3a.5.5 0 0 1-.364-.843l8-8.5a.5.5 0 0 1 .615-.09z" />
                                    </svg>
                                    <span>Today</span>
                                </a>
                            </li>
                            <li>
                                <!-- Links dynamically to weekly trending route -->
                                <a class="dropdown-item text-white rounded-3 d-flex align-items-center gap-2 py-2"
                                    href="{{ url_for('trending_weekly') }}">
                                    <!-- Role Icon: Calendar Range (Weekly collection) -->
                                    <svg xmlns="http://w3.org" width="14" height="14" fill="currentColor"
                                        class="bi bi-calendar-week" viewBox="0 0 16 16">
                                        <path
                                            d="M11 6.5a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm-3 0a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm-5 3a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm3 0a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5z" />
                                        <path
                                            d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5M1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4z" />
                                    </svg>
                                    <span>This Week</span>
                                </a>

                                <!-- Links dynamically to popular route -->
                                <a class="dropdown-item text-white rounded-3 d-flex align-items-center gap-2 py-2"
                                    href="{{ url_for('get_popular_media') }}">
                                    <!-- Role Icon: Fire/Flame (What is hot/Popular right now) -->
                                    <svg xmlns="http://w3.org" width="14" height="14" fill="currentColor"
                                        class="bi bi-fire" viewBox="0 0 16 16">
                                        <path
                                            d="M8 16c3.314 0 6-2 6-5.5 0-1.5-.5-4-2.5-6 .25 1.5-1.25 2-1.25 2C11 4 9 .5 6 0c.357 2 .5 4-2 6-1.25 1-2 2.729-2 4.5C2 14 4.686 16 8 16m0-1c-1.657 0-3-1-3-2.75 0-.75.25-2 1.25-3C6.125 10 7 10.5 7 10.5c-.375-1.25.5-3.25 2-3.5-.179 1-.25 2 1 3 .625.5 1 1.364 1 2.25C11 14 9.657 15 8 15" />
                                    </svg>
                                    <span>Popular</span>
                                </a>
                            </li>
                        </ul>

                    </li>
                </ul>

                <!-- Search -->
                <form class="d-none d-lg-flex position-relative align-items-center" role="search"
                    action="{{ url_for('search') }}" method="GET" onsubmit="handleMobileSearch()">

                    <button
                        class="btn p-0 border-0 position-absolute start-0 ms-3 d-flex align-items-center justify-content-center text-white opacity-50 search-icon-btn"
                        type="submit" style="height: 38px; z-index: 5;">

                        <svg xmlns="http://w3.org" width="15" height="15" fill="currentColor" class="bi bi-search"
                            viewBox="0 0 16 16">
                            <path
                                d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                        </svg>

                    </button>

                    <!-- Added id="navSearchInput" so JavaScript can locate it -->
                    <input id="navSearchInput" autocomplete="off"
                        class="form-control text-white border-0 rounded-pill ps-5 pe-4 search-input-field" type="search"
                        name="q" placeholder="Search" aria-label="Search">
                </form>


            </div>

            <!-- Mobile search is deliberately separate from the menu collapse,
                 so opening it never changes the navbar's height. -->
            <div id="mobileSearchPanel" class="mobile-search-panel d-lg-none" hidden>
                <form class="d-flex position-relative align-items-center" role="search" action="{{ url_for('search') }}"
                    method="GET" onsubmit="handleMobileSearch('mobileSearchInput')">
                    <i class="bi bi-search mobile-search-input-icon" aria-hidden="true"></i>
                    <input id="mobileSearchInput" autocomplete="off"
                        class="form-control text-white border-0 rounded-pill ps-5 pe-4 search-input-field" type="search"
                        name="q" placeholder="Search movies and shows" aria-label="Search movies and shows">
                </form>
            </div>
        </div>
    </nav>
</header>
